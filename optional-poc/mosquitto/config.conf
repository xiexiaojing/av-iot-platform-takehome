# EMQX 配置示例（单机验证用）。
# 生产环境要点：
#   1. 开启 TLS（8883）并使用一机一密；
#   2. 用认证/授权插件做"按 tenant/project 的主题 ACL"，
#      设备只能发布 up/{tenant}/{project}/{device}/#，
#      只能订阅 down/{tenant}/{project}/{device}/#；
#   3. 设置 max_connections 与连接速率限制（批量上线场景）。
node {
  cookie = "c2d-poc-cookie"
}
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 100000
}
dashboard.listeners.http.bind = 18083
